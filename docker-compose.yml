services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sorena
      POSTGRES_PASSWORD: sorena
      POSTGRES_DB: sorena_jobscout
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorena -d sorena_jobscout"]
      interval: 5s
      timeout: 3s
      retries: 5
