[project]
name = "sorena"
version = "0.1.0"
description = "Local-first, zero-cost Jarvis-style AI assistant"
authors = [
    { name = "dorkianaico-creator", email = "dorkian.ai.co@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm<1.92",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
sorena = "sorena:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
