[project]
name = "sorena"
version = "1.0.0"
description = "Local-first, zero-cost Jarvis-style AI assistant"
authors = [
    { name = "dorkianaico-creator", email = "dorkian.ai.co@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "litellm<1.92",
    "mcp>=1.28.1",
    "openwakeword>=0.6.0",
    "piper-tts>=1.4.2",
    "psycopg[binary,pool]>=3.3.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "sentence-transformers>=5.6.0",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.3",
    "tenacity>=9.1.4",
    "websockets>=16.1",
]

[project.scripts]
sorena = "sorena:main"
sorena-mcp = "sorena.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["training/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
